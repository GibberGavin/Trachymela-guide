name: Deploy Trachymela Guide

on:
  push:
    branches: ["main"] # If your default branch is called "master", change "main" to "master"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Serves your whole repository folder

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
